<html lang="tr">

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f1f5f9; 
            color: #0f172a;
        }
        .app-container {
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            background: #ffffff;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
            position: relative;
        }
        .sticky-header {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            z-index: 50;
            border-bottom: 1px solid #e2e8f0;
        }
        .type-btn {
            transition: all 0.2s;
            white-space: nowrap;
            font-size: 10px !important;
            padding: 6px 12px !important;
        }
        .type-btn.active {
            background-color: #1d4ed8;
            color: white;
            box-shadow: 0 2px 6px rgba(29, 78, 216, 0.2);
            border-color: #1d4ed8;
        }
        .school-item {
            transition: all 0.1s ease;
            border-bottom: 1px solid #f1f5f9;
        }
        .school-item:hover {
            background-color: #f8fafc;
        }
        
        .badge-ilkokul { background: #166534; color: #ffffff; }
        .badge-ortaokul { background: #9a3412; color: #ffffff; }
        .badge-lise { background: #1e40af; color: #ffffff; }
        .badge-diger { background: #475569; color: #ffffff; }

        #toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #0f172a;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 1rem;
            font-weight: 700;
            z-index: 100;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #toast.show { transform: translateX(-50%) translateY(0); }

        .copy-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>

        }

        function goHome() {
            document.getElementById('list-view').classList.add('hidden');
            document.getElementById('district-view').classList.remove('hidden');
            document.getElementById('search-input').value = '';
            activeType = 'HEPSİ';
        }

        function filterType(type) {
            activeType = type;
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === type);
            });
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('search-input').value.toLocaleLowerCase('tr-TR');
            let list = schoolData[activeDist] || [];
            if (activeType !== 'HEPSİ') list = list.filter(s => s.tur === activeType);
            if (query) list = list.filter(s => s.adi.toLocaleLowerCase('tr-TR').includes(query) || s.kodu.includes(query));
            
            list.sort((a, b) => a.no - b.no);
            document.getElementById('result-stat').innerText = `${list.length} KURUM`;
            render(list);
        }

        function getBadgeClass(tur) {
            switch(tur) {
                case 'İLKOKUL': return 'badge-ilkokul';
                case 'ORTAOKUL': return 'badge-ortaokul';
                case 'LİSE': return 'badge-lise';
                default: return 'badge-diger';
            }
        }

        function render(list) {
            const container = document.getElementById('results-container');
            container.innerHTML = '';
            list.forEach(item => {
                const div = document.createElement('div');
                div.className = "school-item px-4 py-2 flex items-center justify-between cursor-pointer group";
                div.onclick = () => showDetail(item);
                div.innerHTML = `
                    <div class="flex items-center flex-1 min-w-0 pr-2">
                        <span class="text-[10px] font-black text-slate-400 w-6 flex-shrink-0">${item.no}</span>
                        <div class="flex-1 min-w-0 pl-1">
                            <div class="flex items-center gap-1.5 mb-1">
                                <span class="text-[8px] font-bold px-1 py-0.5 rounded leading-none ${getBadgeClass(item.tur)}">${item.tur}</span>
                                <span class="text-[11px] font-black text-slate-800 font-mono tracking-tighter">${item.kodu}</span>
                            </div>
                            <h4 class="text-[13px] font-bold text-slate-700 leading-tight group-hover:text-blue-700">${item.adi}</h4>
                        </div>
                    </div>
                    <div class="text-slate-300 group-hover:text-blue-600 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7" /></svg>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function showDetail(item) {
            document.getElementById('copy-code').innerText = item.kodu;
            document.getElementById('copy-name').innerText = item.adi;
            document.getElementById('copy-combined').innerText = `${item.kodu} ${item.adi}`;
            document.getElementById('list-view').classList.add('hidden');
            document.getElementById('detail-view').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function showList() {
            document.getElementById('detail-view').classList.add('hidden');
            document.getElementById('list-view').classList.remove('hidden');
        }

        function copyText(id) {
            const text = document.getElementById(id).innerText;
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 1500);
        }
    </script>
</body>
</html>
