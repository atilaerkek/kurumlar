<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okul Seçim Formu</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            background-color: #fff;
        }

        select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .sonuc-container {
            margin-top: 2rem;
            display: none;
            border-top: 2px solid #e2e8f0;
            padding-top: 1.5rem;
        }

        .sonuc-grup {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            padding: 1rem;
            margin-bottom: 0.75rem;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .sonuc-metin {
            font-size: 1rem;
            flex: 1;
            margin-right: 10px;
        }

        .label-text {
            color: #64748b;
            font-weight: 500;
            display: block;
            font-size: 0.8rem;
            margin-bottom: 2px;
        }

        .data-value {
            font-weight: 600;
            color: #0f172a;
            word-break: break-all;
        }

        .kopyala-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
            white-space: nowrap;
            min-width: 100px;
        }

        .kopyala-btn:hover {
            background-color: #1d4ed8;
        }

        .kopyala-btn.success {
            background-color: #10b981;
        }

        @media (max-width: 480px) {
            .sonuc-grup {
                flex-direction: column;
                align-items: flex-start;
            }
            .kopyala-btn {
                width: 100%;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Okul Seçim Formu</h2>
        
        <div class="secim-container">
            <div class="form-group">
                <label for="ilce">İlçe Seçiniz:</label>
                <select id="ilce" onchange="ilceSecildi()">
                    <option value="">İlçe Seçiniz</option>
                    <option value="anamur">Anamur</option>
                    <option value="bozyazi">Bozyazı</option>
                </select>
            </div>

            <div class="form-group">
                <label for="okullar">Kurum Adı Seçiniz:</label>
                <select id="okullar" onchange="okulSecildi()">
                    <option value="">Önce İlçe Seçiniz</option>
                </select>
            </div>
        </div>

        <div id="sonucPaneli" class="sonuc-container">
            <div class="sonuc-grup">
                <div class="sonuc-metin">
                    <span class="label-text">Kurum Kodu:</span>
                    <span id="val_kod" class="data-value"></span>
                </div>
                <button onclick="kopyala('val_kod', this)" class="kopyala-btn">Kopyala</button>
            </div>
            
            <div class="sonuc-grup">
                <div class="sonuc-metin">
                    <span class="label-text">Kurum Adı:</span>
                    <span id="val_okul" class="data-value"></span>
                </div>
                <button onclick="kopyala('val_okul', this)" class="kopyala-btn">Kopyala</button>
            </div>

            <div class="sonuc-grup">
                <div class="sonuc-metin">
                    <span class="label-text">Kurum Kodu ve Adı:</span>
                    <span id="val_birlesik" class="data-value"></span>
                </div>
                <button onclick="kopyala('val_birlesik', this)" class="kopyala-btn">Kopyala</button>
            </div>
        </div>
    </div>

            ]
        };

        function ilceSecildi() {
            const ilceSelect = document.getElementById("ilce");
            const okulSelect = document.getElementById("okullar");
            const sonucPaneli = document.getElementById("sonucPaneli");
            const secilenIlce = ilceSelect.value;

            okulSelect.innerHTML = '<option value="">Okul Seçiniz</option>';
            sonucPaneli.style.display = "none";

            if (secilenIlce && okulVerileri[secilenIlce]) {
                // Alfabetik sıralama (Türkçe karakter duyarlı)
                const siraliOkullar = [...okulVerileri[secilenIlce]].sort((a, b) => a.ad.localeCompare(b.ad, 'tr'));
                
                siraliOkullar.forEach(okul => {
                    const option = document.createElement("option");
                    option.value = okul.id;
                    option.textContent = okul.ad;
                    okulSelect.appendChild(option);
                });
            }
        }

        function okulSecildi() {
            const okulSelect = document.getElementById("okullar");
            const sonucPaneli = document.getElementById("sonucPaneli");
            
            if (okulSelect.value) {
                const secilenOkulAd = okulSelect.options[okulSelect.selectedIndex].text;
                const secilenOkulKod = okulSelect.value;

                document.getElementById("val_kod").innerText = secilenOkulKod;
                document.getElementById("val_okul").innerText = secilenOkulAd;
                document.getElementById("val_birlesik").innerText = secilenOkulKod + " " + secilenOkulAd;

                sonucPaneli.style.display = "block";
            } else {
                sonucPaneli.style.display = "none";
            }
        }

        function kopyala(elementId, btn) {
            const metin = document.getElementById(elementId).innerText;

            const el = document.createElement('textarea');
            el.value = metin;
            el.setAttribute('readonly', '');
            el.style.position = 'absolute';
            el.style.left = '-9999px';
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);

            const orjinalMetin = btn.innerText;
            btn.innerText = "Kopyalandı!";
            btn.classList.add("success");
            
            setTimeout(() => {
                btn.innerText = orjinalMetin;
                btn.classList.remove("success");
            }, 1000);
        }
    </script>
</body>
</html>
