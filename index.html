<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okul Bilgi Sistemi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background-color: rgba(248, 250, 252, 0.98);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #e2e8f0;
        }

        .filter-chip input:checked + span {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .copy-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            display: none;
            z-index: 1000;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translate(-50%, 20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        /* Liste elemanı hover efekti */
        .school-item {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Özel Kaydırma Çubuğu */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-800">

    <div id="app" class="max-w-md mx-auto min-h-screen pb-10">

                                <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />

                                <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />

                </div>

                {sn: 25, kodu: "708710", adi: "Lütfiye Keskin Ortaokulu", t: "ortaokul"},
                {sn: 26, kodu: "708416", adi: "Şehit Murat Namdar Ortaokulu", t: "ortaokul"},
                {sn: 27, kodu: "713661", adi: "Şehit Sedat Yabalak Ortaokulu", t: "ortaokul"},
                {sn: 28, kodu: "708702", adi: "Tekeli Ortaokulu", t: "ortaokul"},
                {sn: 29, kodu: "713680", adi: "Tekmen Ortaokulu", t: "ortaokul"},
                {sn: 30, kodu: "763592", adi: "Bozyazı Mesleki ve Teknik Anadolu Lisesi", t: "lise"},
                {sn: 31, kodu: "751442", adi: "Bozyazı 15 Temmuz Millî İrade Mesleki ve Teknik Anadolu Lisesi", t: "lise"}
            ]
        };

        let activeDistrict = '';

        function selectDistrict(district) {
            activeDistrict = district;
            document.getElementById('current-district-name').innerText = district;
            
            // Filtreleri temizle
            document.querySelectorAll('.filter-chip input').forEach(el => el.checked = false);
            document.getElementById('school-search').value = '';

            document.getElementById('district-view').classList.add('hidden');
            document.getElementById('main-header').classList.add('hidden');
            document.getElementById('list-view').classList.remove('hidden');
            filterAndRender();
        }

        function filterAndRender() {
            const query = document.getElementById('school-search').value.toLocaleLowerCase('tr-TR');
            const selectedFilters = [];
            if (document.getElementById('filter-ilkokul').checked) selectedFilters.push('ilkokul');
            if (document.getElementById('filter-ortaokul').checked) selectedFilters.push('ortaokul');
            if (document.getElementById('filter-lise').checked) selectedFilters.push('lise');
            if (document.getElementById('filter-diger').checked) selectedFilters.push('diger');

            let list = schoolData[activeDistrict];
            
            if (selectedFilters.length > 0) {
                list = list.filter(item => selectedFilters.includes(item.t));
            }

            if (query) {
                list = list.filter(s => 
                    s.adi.toLocaleLowerCase('tr-TR').includes(query) || 
                    s.kodu.includes(query)
                );
            }
            
            document.getElementById('list-total-count-badge').innerText = `${list.length} KURUM LİSTELENDİ`;
            renderList(list);
        }

        function renderList(list) {
            const container = document.getElementById('school-list');
            container.innerHTML = '';
            
            if (list.length === 0) {
                container.innerHTML = `<div class="py-10 text-center text-slate-400 text-sm font-medium">Sonuç bulunamadı...</div>`;
                return;
            }

            list.forEach(item => {
                const btn = document.createElement('button');
                btn.className = "school-item w-full flex items-center gap-3 p-2.5 bg-white border border-slate-100 rounded-xl hover:border-blue-300 hover:bg-blue-50/30 text-left active:scale-[0.98]";
                
                let iconColor = 'bg-slate-100 text-slate-500';
                if(item.t === 'ilkokul') iconColor = 'bg-orange-100 text-orange-600';
                else if(item.t === 'ortaokul') iconColor = 'bg-blue-100 text-blue-600';
                else if(item.t === 'lise') iconColor = 'bg-rose-100 text-rose-600';

                btn.onclick = () => showDetail(item);
                btn.innerHTML = `
                    <div class="flex-shrink-0 w-8 h-8 ${iconColor} rounded-lg flex items-center justify-center font-bold text-[10px]">
                        ${item.sn}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2">
                            <span class="text-[9px] font-black text-slate-400 font-mono tracking-tight">${item.kodu}</span>
                        </div>
                        <h3 class="text-[13px] font-bold text-slate-700 truncate">${item.adi}</h3>
                    </div>
                `;
                container.appendChild(btn);
            });
        }

        function goBack() {
            document.getElementById('list-view').classList.add('hidden');
            document.getElementById('district-view').classList.remove('hidden');
            document.getElementById('main-header').classList.remove('hidden');
        }

        function showDetail(item) {
            document.getElementById('copy-code-text').innerText = item.kodu;
            document.getElementById('copy-name-text').innerText = item.adi;
            document.getElementById('copy-both-text').innerText = `${item.kodu} ${item.adi}`;
            document.getElementById('detail-name-display').innerText = item.adi;
            
            const badge = document.getElementById('detail-type-badge');
            badge.innerText = item.t;
            badge.className = "inline-block px-2 py-0.5 rounded text-[9px] font-black uppercase tracking-widest mb-2 ";
            if(item.t === 'ilkokul') badge.classList.add('bg-orange-100', 'text-orange-600');
            else if(item.t === 'ortaokul') badge.classList.add('bg-blue-100', 'text-blue-600');
            else if(item.t === 'lise') badge.classList.add('bg-rose-100', 'text-rose-600');
            else badge.classList.add('bg-slate-100', 'text-slate-600');

            document.getElementById('list-view').classList.add('hidden');
            document.getElementById('detail-view').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showListView() {
            document.getElementById('detail-view').classList.add('hidden');
            document.getElementById('list-view').classList.remove('hidden');
        }

        function copyText(elementId) {
            const text = document.getElementById(elementId).innerText;
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 1500);
        }
    </script>
</body>
</html>
